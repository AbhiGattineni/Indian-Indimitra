name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Load Firebase web config into env
        run: |
          node -e "
            const c = JSON.parse(process.env.VITE_FIREBASE_CONFIG);
            const fs = require('fs');
            const map = {
              VITE_FIREBASE_API_KEY: c.apiKey,
              VITE_FIREBASE_AUTH_DOMAIN: c.authDomain,
              VITE_FIREBASE_PROJECT_ID: c.projectId,
              VITE_FIREBASE_STORAGE_BUCKET: c.storageBucket,
              VITE_FIREBASE_MESSAGING_SENDER_ID: c.messagingSenderId,
              VITE_FIREBASE_APP_ID: c.appId,
            };
            const lines = Object.entries(map).map(([k, v]) => k + '=' + v).join('\n');
            fs.appendFileSync(process.env.GITHUB_ENV, lines + '\n');
          "
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}

      - run: npm run build

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting + Firestore rules
        run: npx firebase-tools deploy --only hosting,firestore:rules --project indimitra-95a12 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
