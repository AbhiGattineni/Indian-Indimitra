name: Deploy to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Load Firebase web config into env
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.VITE_FIREBASE_CONFIG }}
        run: |
          cat > "$RUNNER_TEMP/parse-config.js" <<'EOF'
          const fs = require('fs');
          const raw = process.env.VITE_FIREBASE_CONFIG;
          const pick = (key) => {
            const m = raw.match(new RegExp(key + "\\s*:\\s*[\"']([^\"']+)[\"']"));
            return m ? m[1] : '';
          };
          const map = {
            VITE_FIREBASE_API_KEY: pick('apiKey'),
            VITE_FIREBASE_AUTH_DOMAIN: pick('authDomain'),
            VITE_FIREBASE_PROJECT_ID: pick('projectId'),
            VITE_FIREBASE_STORAGE_BUCKET: pick('storageBucket'),
            VITE_FIREBASE_MESSAGING_SENDER_ID: pick('messagingSenderId'),
            VITE_FIREBASE_APP_ID: pick('appId'),
          };
          const missing = Object.entries(map).filter(([, v]) => !v).map(([k]) => k);
          if (missing.length) {
            console.error('Could not extract from VITE_FIREBASE_CONFIG: ' + missing.join(', '));
            process.exit(1);
          }
          const lines = Object.entries(map).map(([k, v]) => `${k}=${v}`).join('\n');
          fs.appendFileSync(process.env.GITHUB_ENV, lines + '\n');
          EOF
          node "$RUNNER_TEMP/parse-config.js"

      # Optional — unset until a Google Maps API key is configured, in which
      # case Checkout falls back to plain manual address entry (see
      # src/lib/googlePlaces.js). Safe to append even when empty.
      - name: Load Google Maps API key into env
        run: echo "VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}" >> "$GITHUB_ENV"

      - run: npm run build

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy hosting + Firestore rules
        run: npx firebase-tools deploy --only hosting,firestore:rules --project indimitra-95a12 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json

      - name: Verify what the live site is actually serving
        run: |
          echo "--- Expected (this build's dist/index.html) ---"
          cat dist/index.html
          echo ""
          echo "--- Live site (fetched fresh, cache-busted) ---"
          curl -sS "https://indimitra-95a12.web.app/?cachebust=$(date +%s)" \
            -H "Cache-Control: no-cache" -H "Pragma: no-cache"

      - name: Install functions dependencies
        run: npm ci --prefix functions

      # Best-effort: hosting/firestore above are the critical path and must
      # never be blocked by this. Cloud Functions deploys were never wired
      # into CI before (see functions/index.js's EMAILJS_PRIVATE_KEY secret,
      # which was only ever set manually) — continue-on-error so a missing
      # secret here can't fail the whole workflow.
      - name: Deploy Cloud Functions (best-effort)
        continue-on-error: true
        run: npx firebase-tools deploy --only functions --project indimitra-95a12 --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
