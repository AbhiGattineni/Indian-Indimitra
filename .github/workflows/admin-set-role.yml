name: One-off - Set user role

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'User email (must have signed in at least once)'
        required: true
      role:
        description: 'New role: customer, seller, fdm, or admin'
        required: true

jobs:
  set-role:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --prefix functions

      - name: Write service account key
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set user role
        run: node functions/scripts/set-user-role.js "${{ inputs.email }}" "${{ inputs.role }}"
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
